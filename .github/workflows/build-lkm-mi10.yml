name: Build dfroot.ko for Mi10 (4.19)

on:
  workflow_dispatch:

jobs:
  build-lkm:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout DirtyFrag (for lkm/dfroot.c)
        uses: actions/checkout@v4

      - name: 2. Download Clang toolchain
        run: |
          mkdir -p kernel_workspace
          cd kernel_workspace
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240125-release/Clang-19.0.0git-20240125.tar.gz
          mkdir -p clang
          tar -xzf Clang-19.0.0git-20240125.tar.gz -C clang

      - name: 3. Clone Mi10 kernel source (n0kernel 4.19)
        run: |
          cd kernel_workspace
          git clone https://github.com/clcwpwqi/kernel_xiaomi_sm8250_n0kernel --depth=1 android_kernel

      - name: 4. Prepare kernel config (match Mi10 vermagic)
        run: |
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH
          cd kernel_workspace/android_kernel
          COMMON="CC=clang ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-buildroot-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-androideabi-"
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 113/' Makefile
          # Force-enable kprobes in defconfig (dfroot.c relies on register_kprobe)
          printf 'CONFIG_KPROBES=y\nCONFIG_KALLSYMS=y\nCONFIG_KALLSYMS_ALL=y\nCONFIG_KPROBE_EVENTS=y\nCONFIG_MODULE_UNLOAD=y\n' >> arch/arm64/configs/vendor/umi_defconfig
          make -j$(nproc --all) $COMMON vendor/umi_defconfig
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-perf-g655218745b37"/' .config
          sed -i 's/CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/' .config
          sed -i 's/# CONFIG_MODULES is not set/CONFIG_MODULES=y/' .config
          make -j$(nproc --all) $COMMON olddefconfig
          make -j$(nproc --all) $COMMON prepare scripts
          # Verify kprobes is enabled
          echo "=== KPROBES config ==="
          grep -E "^CONFIG_KPROBES|^# CONFIG_KPROBES" .config || true
          cat include/config/kernel.release

      - name: 5. Build dfroot.ko
        run: |
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH
          cd kernel_workspace/android_kernel
          COMMON="CC=clang ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-buildroot-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-androideabi-"
          LKM=$GITHUB_WORKSPACE/lkm
          make -j$(nproc --all) $COMMON M=$LKM modules 2>&1 || true
          ls -la $LKM/dfroot.o
          if [ ! -f $LKM/dfroot.mod.c ]; then
            echo "Generating dfroot.mod.c from template..."
            cp $LKM/dfroot.mod.c.template $LKM/dfroot.mod.c
          fi
          ls -la $LKM/dfroot.mod.c
          make -j$(nproc --all) $COMMON M=$LKM modules 2>&1 || true
          if [ ! -f $LKM/dfroot.ko ]; then
            echo "Linking manually..."
            ld.lld -r -o $LKM/dfroot.ko $LKM/dfroot.o $LKM/dfroot.mod.o
          fi
          ls -la $LKM/dfroot.ko
          # Verify code is complete (init_module should reference register_kprobe)
          echo "=== dfroot.ko symbols ==="
          llvm-nm $LKM/dfroot.ko | grep -E "register_kprobe|__this_module|selinux|kallsyms" || true

      - name: 6. Strip dfroot.ko
        run: |
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            lkm/dfroot.ko
          ls -la lkm/dfroot.ko

      - name: 7. Upload dfroot.ko
        uses: actions/upload-artifact@v4
        with:
          name: dfroot-mi10-4.19
          path: lkm/dfroot.ko